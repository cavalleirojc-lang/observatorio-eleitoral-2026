
name: Consultar dados oficiais TSE

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Consultar dados oficiais do TSE
        run: python scripts/coletar.py

      - name: Salvar resultados e histórico
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git add data/atual.json data/historico.json

          if ! git diff --cached --quiet; then
            git commit -m 'Atualizar consulta TSE'
            git push
          else
            echo 'Nenhuma alteração para publicar.'
          fi
